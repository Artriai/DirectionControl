plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('DIRECTION_CONTROL_KEYSTORE_PATH')

android {
    namespace = 'app.directioncontrol'
    compileSdk = 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "app.directioncontrol"
        minSdk = 21
        targetSdk = 36
        versionCode = 6
        versionName = "1.0.6"
    }

    signingConfigs {
        if (releaseKeystorePath) {
            sharedRelease {
                storeFile = file(releaseKeystorePath)
                storePassword = 'android'
                keyAlias = 'androiddebugkey'
                keyPassword = 'android'
            }
        }
    }

    buildTypes {
        release {
            signingConfig = releaseKeystorePath
                    ? signingConfigs.sharedRelease
                    : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.8.1'
    testImplementation 'junit:junit:4.13.2'
}
