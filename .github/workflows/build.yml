name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectionControl-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
