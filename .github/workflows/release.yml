name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0. Leave empty to use v1.0.<run number>."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DIRECTION_CONTROL_KEYSTORE_BASE64 }}
          EXPECTED_CERT_SHA256: "96:E7:4B:7D:22:16:78:92:5E:BA:8B:F5:07:2B:C2:60:B5:ED:C4:0A:E4:3A:73:2E:7B:E3:BF:B3:77:E6:74:B5"
        shell: bash
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "Missing DIRECTION_CONTROL_KEYSTORE_BASE64 repository secret." >&2
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/direction-control-release.keystore"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          actual_cert_sha256="$(
            keytool -exportcert \
              -keystore "${keystore_path}" \
              -storepass android \
              -alias androiddebugkey \
              -rfc \
              | openssl x509 -noout -fingerprint -sha256 \
              | cut -d= -f2
          )"
          if [[ "${actual_cert_sha256}" != "${EXPECTED_CERT_SHA256}" ]]; then
            echo "The configured keystore is not the Lyrics Plus signing key." >&2
            echo "Expected certificate: ${EXPECTED_CERT_SHA256}" >&2
            echo "Actual certificate:   ${actual_cert_sha256}" >&2
            exit 1
          fi

          echo "DIRECTION_CONTROL_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Build and test
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --warning-mode all

      - name: Prepare release asset
        id: asset
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${REQUESTED_TAG}" ]]; then
            tag="${REQUESTED_TAG}"
          else
            tag="v1.0.${GITHUB_RUN_NUMBER}"
          fi

          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/DirectionControl-${tag}.apk"
          sha256sum "release/DirectionControl-${tag}.apk" > "release/DirectionControl-${tag}.apk.sha256"
          {
            echo "Automated cloud build for DirectionControl."
            echo
            echo "APK SHA256:"
            echo '```'
            cat "release/DirectionControl-${tag}.apk.sha256"
            echo '```'
          } > "release/notes-${tag}.md"

          {
            echo "tag=${tag}"
            echo "apk=release/DirectionControl-${tag}.apk"
            echo "sha=release/DirectionControl-${tag}.apk.sha256"
            echo "notes=release/notes-${tag}.md"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectionControl-${{ steps.asset.outputs.tag }}
          path: |
            ${{ steps.asset.outputs.apk }}
            ${{ steps.asset.outputs.sha }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.asset.outputs.tag }}"
          gh release create "${tag}" \
            "${{ steps.asset.outputs.apk }}" \
            "${{ steps.asset.outputs.sha }}" \
            --target "${GITHUB_SHA}" \
            --title "DirectionControl ${tag}" \
            --notes-file "${{ steps.asset.outputs.notes }}" \
            --latest
